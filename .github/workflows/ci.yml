name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Only execute repository-owned code on the persistent runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Build for Linux x86-64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/linux-amd64
          go build -trimpath -o dist/linux-amd64/systemd-lsp ./cmd/systemd-lsp
          tar -czf dist/systemd-lsp-linux-amd64.tar.gz -C dist/linux-amd64 systemd-lsp

      - name: Upload Linux x86-64 build
        uses: actions/upload-artifact@v7
        with:
          name: systemd-lsp-linux-amd64
          path: dist/systemd-lsp-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Build for Apple Silicon
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/darwin-arm64
          go build -trimpath -o dist/darwin-arm64/systemd-lsp ./cmd/systemd-lsp
          tar -czf dist/systemd-lsp-darwin-arm64.tar.gz -C dist/darwin-arm64 systemd-lsp

      - name: Upload Apple Silicon build
        uses: actions/upload-artifact@v7
        with:
          name: systemd-lsp-darwin-arm64
          path: dist/systemd-lsp-darwin-arm64.tar.gz
          if-no-files-found: error

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested builds
        uses: actions/download-artifact@v8
        with:
          pattern: systemd-lsp-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish release
        uses: actions/github-script@v9
        env:
          RELEASE_DIR: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const repo = context.repo;
            const { data: main } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            if (main.commit.sha !== context.sha) {
              core.notice('Skipping release because main has advanced past this build.');
              return;
            }
            const names = ['systemd-lsp-linux-amd64.tar.gz', 'systemd-lsp-darwin-arm64.tar.gz'];
            const assets = await Promise.all(names.map(async name => ({
              name, data: await fs.readFile(path.join(process.env.RELEASE_DIR, name))
            })));
            const checksums = assets.map(({ name, data }) =>
              `${crypto.createHash('sha256').update(data).digest('hex')}  ${name}\n`
            ).join('');
            assets.push({ name: 'SHA256SUMS', data: Buffer.from(checksums) });
            const tag = `build-${context.runNumber}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Build ${context.runNumber} (${context.sha.slice(0, 7)})`,
              body: `Automated main build after successful tests, vet, and builds.\n\nCommit: ${context.sha}\nCI: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}\n\nIncludes Linux x86-64 and macOS Apple Silicon binaries and SHA256SUMS.`,
              draft: true
            });
            for (const { name, data } of assets) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, draft: false, make_latest: 'true'
            });
            await core.summary.addLink('Download release', published.html_url).write();
